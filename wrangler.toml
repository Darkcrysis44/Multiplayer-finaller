name = "multiplayer-game1"
main = "worker.js"
compatibility_date = "2026-08-16"

[assets]
directory = "./public"
binding = "ASSETS"

[durable_objects]
bindings = [
  { name = "ROOM", class_name = "Room" },
  { name = "AUTH", class_name = "Auth" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Auth"]
